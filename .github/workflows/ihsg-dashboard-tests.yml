name: IHSG public dashboard tests

"on":
  pull_request:
    paths: ['ihsg-market-breadth/**', '.github/workflows/ihsg-dashboard-tests.yml']
  push:
    branches: [main]
    paths: ['ihsg-market-breadth/**', '.github/workflows/ihsg-dashboard-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Test local aggregate dashboard without provider access
        run: |
          node --check ihsg-market-breadth/app.js
          node --check ihsg-market-breadth/help.js
          python -m unittest discover -s ihsg-market-breadth/tests -v
