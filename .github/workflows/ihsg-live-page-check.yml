name: IHSG live page check
# Read-only check of the deployed dashboard against this commit (ihsg-market-breadth/tests/live_page_check.py): the
# served bytes of every shipped file, the official IDX Margin archive in margin-data.js, and Market Breadth, Margin
# Monitor and Data Status in Chromium at desktop and mobile width. Manual dispatch on main; no secret; nothing is
# written to the repository.

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ihsg-live-page-check
  cancel-in-progress: false

jobs:
  live-page-check:
    if: ${{ github.repository == 'Setyadi-House/market-heat-public' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Check the deployed page against this commit
        run: python ihsg-market-breadth/tests/live_page_check.py --out out/live-page-check
      - name: Save the report and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ihsg-live-page-check
          path: out/live-page-check/
          retention-days: 30
          if-no-files-found: warn
